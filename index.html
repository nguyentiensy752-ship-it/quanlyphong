<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hiện trạng phòng">
<title>Quản lý hiện trạng phòng</title>
<style>
:root{
  --ground:#E7EAEC; --paper:#FFFFFF; --ink:#0E1216; --ink-2:#4A555E; --ink-3:#8A959D;
  --line:#D4D9DD; --line-2:#E6EAED;
  --pine:#12514A;
  --ok:#2C7A4B; --clean:#A9640B; --refill:#1F6099; --replace:#9E3418; --broken:#6E1616;
  --tape:#F2C230; --r:12px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2{margin:0;font-weight:650;letter-spacing:-.02em}

#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:rgba(231,234,236,.93);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
#top .bar{display:flex;align-items:center;gap:8px;min-height:32px}
#top h1{font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{font-size:15px;color:var(--pine);font-weight:600;padding:4px 6px 4px 0;flex:none}
#view{flex:1;padding:14px 16px calc(150px + var(--safe-b))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabs .t{flex:1;padding:8px 1px 7px;text-align:center;color:var(--ink-3);font-size:9.5px;font-weight:600;letter-spacing:-.01em}
#tabs .t b{display:block;font-size:18px;line-height:1.25;font-weight:400}
#tabs .t.on{color:var(--pine)}
#tabs.hide{display:none}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.muted{color:var(--ink-2);font-size:13.5px}
.btn{display:block;width:100%;text-align:center;background:var(--pine);color:#fff;border-radius:10px;
  padding:12px 16px;font-weight:650;font-size:15px}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--replace);border:1px solid #E3BDB2}
.btn:active{opacity:.72}
.btn[disabled]{opacity:.4}
input[type=text],input[type=number],input[type=email],input[type=password]{width:100%;background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:16px}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.hr{height:1px;background:var(--line-2);margin:12px -14px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{text-align:center;padding:34px 18px;color:var(--ink-2)}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:5px}

.st-ok{--c:var(--ok)} .st-clean{--c:var(--clean)} .st-refill{--c:var(--refill)}
.st-replace{--c:var(--replace)} .st-broken{--c:var(--broken)} .st-none{--c:var(--ink-3)}
.dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--c);border:1px solid currentColor;
  border-radius:6px;padding:1px 7px;white-space:nowrap}

.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;border-left:5px solid var(--tape)}
.hero .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#9AA6AE;font-weight:700}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.hero .big i{font-size:19px;color:#9AA6AE;font-weight:600;font-style:normal}
.hero .sub{font-size:13.5px;color:#C3CCD2}
.hero .split{display:flex;gap:14px;margin-top:13px;padding-top:12px;border-top:1px solid #2A3138}
.hero .split div{flex:1}
.hero .split .n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .split .l{font-size:11px;color:#9AA6AE;font-weight:600}

.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.key{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 7px 7px;text-align:left;
  position:relative;overflow:hidden;min-height:62px;display:flex;flex-direction:column;justify-content:space-between}
.key:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--ink-3))}
.key .no{font-size:15px;font-weight:700;letter-spacing:-.02em;padding-left:6px;font-variant-numeric:tabular-nums}
.key .mt{font-size:10.5px;color:var(--ink-3);font-weight:600;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key .cnt{position:absolute;right:5px;top:5px;background:var(--c);color:#fff;font-size:10px;font-weight:700;
  border-radius:5px;padding:1px 5px;font-variant-numeric:tabular-nums}
.key.due{box-shadow:inset 0 0 0 2px var(--tape)}

.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t1{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink-3);font-size:17px;flex:none}

.cat{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:9px;overflow:hidden}
.cat .h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.cat .h .nm{flex:1;font-weight:650;font-size:15px}
.cat .h .pr{font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cat.done .h .pr{color:var(--ok)}
.item{padding:12px 14px;border-top:1px solid var(--line-2)}
.item .nm{font-weight:600;font-size:14.5px;margin-bottom:9px;display:flex;gap:8px;align-items:center}
.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sts button{border:1px solid var(--line);border-radius:8px;padding:7px 2px;font-size:10.5px;font-weight:700;
  color:var(--ink-3);line-height:1.25;background:#fff}
.sts button.on{background:var(--c);border-color:var(--c);color:#fff}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.th{position:relative;width:62px;height:62px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--line-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.62);color:#fff;width:19px;height:19px;
  border-radius:5px;font-size:12px;line-height:19px;text-align:center;padding:0}
.addph{width:62px;height:62px;border:1px dashed var(--line);border-radius:8px;color:var(--ink-3);font-size:20px;background:#fff}

.sticky{position:fixed;left:0;right:0;bottom:calc(56px + var(--safe-b));z-index:35;padding:10px 16px 12px;
  background:linear-gradient(to top,var(--ground) 66%,rgba(231,234,236,0));max-width:820px;margin:0 auto}
.sticky .btn{box-shadow:0 4px 16px rgba(14,18,22,.18)}
.sticky.nobar{bottom:var(--safe-b)}

#sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(8,10,12,.45)}
#sheet.on{display:flex}
#sheet .box{background:var(--paper);border-radius:16px 16px 0 0;width:100%;max-width:820px;
  padding:16px 16px calc(18px + var(--safe-b));max-height:88vh;overflow:auto;
  box-shadow:0 -8px 32px rgba(14,18,22,.25)}
@media (min-width:700px){#sheet{align-items:center}#sheet .box{border-radius:16px;max-width:520px}}
#lb{position:fixed;inset:0;background:rgba(8,10,12,.94);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#lb img{max-width:100%;max-height:88vh;border-radius:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + var(--safe-b));z-index:95;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s;max-width:88%;text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;left:0;right:0;top:0;height:3px;background:var(--tape);transform:scaleX(0);
  transform-origin:left;transition:transform .3s;z-index:99}
#busy.on{transform:scaleX(.85)}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function dstr(v){ if(!v) return '';
  const d=new Date(v), n=new Date();
  const dd=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(dd===0)return t('today'); if(dd===1)return t('yesterday'); if(dd<30)return t('daysAgo',dd);
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}` }

function compress(file, max=1000, q=0.55){ return new Promise(res=>{
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image();
    im.onload=()=>{ let{width:w,height:h}=im; const sc=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(im,0,0,w,h);
      cv.toBlob(b=>res(b),'image/jpeg',q) };
    im.onerror=()=>res(null); im.src=fr.result };
  fr.onerror=()=>res(null); fr.readAsDataURL(file) })}

function pickPhotos(cb, camera){
  const p = camera ? $('#pickerCam') : $('#picker'); p.value='';
  p.onchange = async () => {
    const fs=[...p.files]; if(!fs.length) return;
    toast(t('processing'));
    const out=[];
    for(const f of fs){ const b=await compress(f); if(b) out.push({blob:b, url:URL.createObjectURL(b)}) }
    cb(out);
  };
  p.click();
}

async function signUrls(paths){
  const need = paths.filter(p => !signed.has(p));
  if(need.length){
    const {data} = await sb.storage.from('photos').createSignedUrls(need, 3600);
    (data||[]).forEach(d => { if(d.signedUrl) signed.set(d.path, d.signedUrl) });
  }
  return paths.map(p => signed.get(p)).filter(Boolean);
}

async function loadAll(){
  busy(true);
  const [ro, ci, ii, ex, sl, si, lv] = await Promise.all([
    sb.from('room_overview').select('*').order('building_sort').order('sort'),
    sb.from('checklist').select('*').order('area_sort').order('item_sort'),
    sb.from('issues').select('*').is('resolved_at', null).order('created_at', {ascending:false}),
    sb.from('checklist_exclusions').select('*'),
    sb.from('stock_locations').select('*').order('kind').order('sort'),
    sb.from('stock_items').select('*').eq('active', true).order('sort'),
    sb.from('stock_levels').select('*')
  ]);
  busy(false);
  const err = ro.error || ci.error || ii.error;
  if(err){ toast(t('errLoad') + err.message); return false }
  rooms = ro.data || [];
  openIssues = ii.data || [];
  const map = new Map();
  AJ.clear(); IJ.clear();
  (ci.data||[]).forEach(r => {
    if(r.area_ja) AJ.set(r.area, r.area_ja);
    if(r.item_ja) IJ.set(r.item, r.item_ja);
    if(!map.has(r.area)) map.set(r.area, []); map.get(r.area).push(r) });
  allItems = ci.data || [];
  if(ex.error || sl.error) toast(t('errTable'));
  exSet = new Set((ex.data||[]).map(e => e.room_id + '|' + e.checklist_id));
  stLocs  = sl.data || [];
  stItems = si.data || [];
  stLv = new Map((lv.data||[]).map(r => [r.location_id + '|' + r.item_id, r]));
  checklist = group(allItems.filter(r => !r.common_only && !r.scope_room_id && !r.scope_building_id));
  return true;
}

function group(items){
  const m = new Map();
  items.forEach(r => { if(!m.has(r.area)) m.set(r.area, []); m.get(r.area).push(r) });
  return [...m].map(([area, items]) => ({area, items}));
}
// Hạng mục áp dụng cho một phòng: chung + riêng toà + riêng phòng, trừ mục đã tắt
function itemsFor(room, includeOff){
  return allItems.filter(r => {
    if(!!r.common_only !== !!room.is_common) return false;
    if(!includeOff && exSet.has(room.id + '|' + r.id)) return false;
    if(r.scope_room_id) return r.scope_room_id === room.id;
    if(r.scope_building_id) return r.scope_building_id === room.building_id;
    return true;
  });
}
const checklistFor = room => group(itemsFor(room));

async function paintPhotos(){
  for(const el of [...document.querySelectorAll('[data-photos]')]){
    const paths = el.dataset.photos ? el.dataset.photos.split('|').filter(Boolean) : [];
    const urls = await signUrls(paths);
    const editable = !!el.dataset.issue;
    el.innerHTML = urls.map((u,i) => `<span class="th"><img src="${u}" data-zoom="${u}" alt=""
        onerror="this.parentNode.style.display='none'">
      ${editable?`<button class="x" data-rmis="${el.dataset.issue}|${paths[i]}">×</button>`:''}</span>`).join('')
      + (editable ? `<button class="addph" data-addis="${el.dataset.issue}" title="${t('takePhoto')}">📷</button>`
                   + `<button class="addph" data-addlib="${el.dataset.issue}" title="${t('fromLibrary')}">🖼</button>` : '');
  }
  bindAll('[data-zoom]', i => lightbox(i.dataset.zoom));
  const uploadTo = async (id, ph) => {
    const iss = openIssues.find(x => x.id === id);
    if(!iss) return;
    busy(true);
    const added = [];
    for(let n=0; n<ph.length; n++){
      const path = `${iss.room_id}/${id}/extra-${Date.now()}-${n}.jpg`;
      const {error} = await sb.storage.from('photos').upload(path, ph[n].blob, {contentType:'image/jpeg'});
      if(!error) added.push(path);
    }
    const photos = [...(iss.photos||[]), ...added];
    const {error} = await sb.from('issues').update({photos}).eq('id', id);
    busy(false);
    if(error) return toast(t('errSavePhoto') + error.message);
    iss.photos = photos; toast(t('photoAdded', added.length)); render();
  };
  bindAll('[data-addis]',  b => pickPhotos(ph => uploadTo(b.dataset.addis, ph), true));
  bindAll('[data-addlib]', b => pickPhotos(ph => uploadTo(b.dataset.addlib, ph), false));
  bindAll('[data-rmis]', async b => {
    if(!confirm(t('delPhoto'))) return;
    const [id, path] = b.dataset.rmis.split('|');
    const iss = openIssues.find(x => x.id === id); if(!iss) return;
    busy(true);
    await sb.storage.from('photos').remove([path]);
    const photos = (iss.photos||[]).filter(p => p !== path);
    const {error} = await sb.from('issues').update({photos}).eq('id', id);
    busy(false);
    if(error) return toast(t('errDel') + error.message);
    iss.photos = photos; signed.delete(path); toast(t('photoDeleted')); render();
  });
}
function bindIssues(){
  bindAll('[data-done]', async b => {
    b.disabled = true; busy(true);
    const {error} = await sb.from('issues').update({
      resolved_at: new Date().toISOString(), resolved_by: me.id, resolved_by_name: me.name
    }).eq('id', b.dataset.done);
    busy(false);
    if(error) { b.disabled=false; return toast(t('errSave')+error.message) }
    openIssues = openIssues.filter(x => x.id !== b.dataset.done);
    rooms.forEach(x => { x.open_count = issuesOf(x).length;
      const ws = issuesOf(x).map(i => ({broken:1,replace:2,refill:3,clean:4})[i.status]);
      x.worst_rank = ws.length ? Math.min(...ws) : null });
    toast(t('doneOk')); render();
  });
}

function startInspect(r){
  draft = {room:r, cl:checklistFor(r), res:{}, open:0};
  go('inspect');
}
function vInspect(){
  if(!draft) return go('home');
  const r = draft.room;
  head(t('checking', rname(r)), t('cancel'), () => {
    if(confirm(t('cancelAsk'))){ draft=null; go('room',{id:r.id}) }});
  const CL = draft.cl;
  const total = CL.reduce((a,c) => a + c.items.length, 0);
  const done = Object.keys(draft.res).length;
  $('#view').innerHTML = `
  <div class="card" style="padding:12px 14px">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="muted" style="flex:1">${t('inspector')} <b style="color:var(--ink)">${esc(me.name)}</b></span>
      <span class="muted" style="font-variant-numeric:tabular-nums;font-weight:650">${done}/${total}</span></div>
    <div style="height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:9px">
      <div style="width:${total?Math.round(done/total*100):0}%;height:100%;background:var(--pine)"></div></div>
  </div>
  ${CL.map((c, ci) => {
    const dn = c.items.filter((_,ii) => draft.res[ci+'-'+ii]).length;
    const bad = c.items.filter((_,ii) => { const v=draft.res[ci+'-'+ii]; return v && v.st!=='ok' }).length;
    return `<div class="cat ${dn===c.items.length?'done':''}">
      <button class="h" data-cat="${ci}">
        <span class="dot ${bad?'st-clean':(dn===c.items.length?'st-ok':'st-none')}"></span>
        <span class="nm">${esc(areaName(c.area))}</span>
        <span class="pr">${dn}/${c.items.length}${bad?` · ${t('tasksN', bad)}`:''}</span>
        <span class="chev">${draft.open===ci?'⌄':'›'}</span></button>
      ${draft.open===ci ? c.items.map((it,ii) => itemHTML(it, ci, ii)).join('') : ''}
    </div>`;
  }).join('')}`;
  addSticky(done ? t('saveResult', done, total) : t('pickOne'), finishInspect, !done);
  bindAll('[data-cat]', b => { const c=+b.dataset.cat; draft.open = draft.open===c ? -1 : c; render() });
  bindItem();
}
function itemHTML(it, ci, ii){
  const key = ci+'-'+ii, v = draft.res[key];
  let h = `<div class="item"><div class="nm"><span class="dot ${v?'st-'+STATUS[v.st].c:'st-none'}"></span>${esc(itemName(it.item))}</div>
    <div class="sts">${ORDER.map(k =>
      `<button class="st-${STATUS[k].c} ${v&&v.st===k?'on':''}" data-set="${key}|${k}">${ss(k)}</button>`).join('')}</div>`;
  if(v && v.st!=='ok'){
    h += `<div style="margin-top:9px">
      <input type="text" placeholder="${t('noteHint')}" value="${esc(v.note||'')}" data-note="${key}">
      <div class="thumbs">
        ${(v.ph||[]).map((p,pi) => `<span class="th"><img src="${p.url}" data-zoom="${p.url}" alt="">
          <button class="x" data-rmph="${key}|${pi}">×</button></span>`).join('')}
        <button class="addph" data-cam="${key}" title="${t('takePhoto')}">📷</button>
        <button class="addph" data-lib="${key}" title="${t('fromLibrary')}">🖼</button></div></div>`;
  }
  return h + '</div>';
}
function bindItem(){
  bindAll('[data-set]', b => {
    const [key, st] = b.dataset.set.split('|');
    const cur = draft.res[key] || {};
    draft.res[key] = {st, note:cur.note||'', ph:cur.ph||[], area:null};
    render();
  });
  document.querySelectorAll('[data-note]').forEach(el =>
    el.oninput = () => { draft.res[el.dataset.note].note = el.value });
  bindAll('[data-zoom]', i => lightbox(i.dataset.zoom));
  const addTo = (key, ph) => {
    const v = draft.res[key];
    v.ph = (v.ph||[]).concat(ph).slice(0,4);
    render(); toast(t('photoAdded', ph.length));
  };
  bindAll('[data-cam]', b => pickPhotos(ph => addTo(b.dataset.cam, ph), true));
  bindAll('[data-lib]', b => pickPhotos(ph => addTo(b.dataset.lib, ph), false));
  bindAll('[data-rmph]', b => {
    const [key, pi] = b.dataset.rmph.split('|');
    draft.res[key].ph.splice(+pi, 1); render();
  });
}
async function finishInspect(){
  const r = draft.room;
  busy(true);
  const {data: insp, error: e1} = await sb.from('inspections').insert({
    room_id: r.id, inspector_id: me.id, inspector_name: me.name,
    checked_count: Object.keys(draft.res).length
  }).select().single();
  if(e1){ busy(false); return toast(t('errSave') + e1.message) }

  const bad = Object.entries(draft.res).filter(([,v]) => v.st !== 'ok');
  const rows = [];
  for(const [key, v] of bad){
    const [ci, ii] = key.split('-').map(Number);
    const paths = [];
    for(let n=0; n<(v.ph||[]).length; n++){
      const path = `${r.id}/${insp.id}/${key}-${n}.jpg`;
      const {error} = await sb.storage.from('photos').upload(path, v.ph[n].blob, {contentType:'image/jpeg'});
      if(!error) paths.push(path);
    }
    rows.push({ inspection_id: insp.id, room_id: r.id,
      area: draft.cl[ci].area, item: draft.cl[ci].items[ii].item,
      status: v.st, note: v.note||'', photos: paths, created_by_name: me.name });
  }
  if(rows.length){
    const {error: e2} = await sb.from('issues').insert(rows);
    if(e2){ busy(false); return toast(t('errIssue') + e2.message) }
  }
  draft = null;
  await loadAll();
  toast(rows.length ? t('savedIssues', rows.length) : t('savedOk'));
  go('room', {id:r.id});
}

/* ============ QUẢN LÝ TOÀ NHÀ & PHÒNG (chỉ admin) ============ */
function parseRooms(s){
  const out=[];
  String(s||'').split(/[,\n;]/).forEach(p => {
    p=p.trim(); if(!p) return;
    const m = p.match(/^(\D*)(\d+)\s*[-–]\s*(\D*)(\d+)$/);
    if(m){
      const pre=m[1]||m[3], a=+m[2], b=+m[4], w=m[2].length;
      if(b>=a && b-a<400){ for(let i=a;i<=b;i++) out.push(pre+String(i).padStart(w,'0')); return }
    }
    out.push(p);
  });
  return [...new Set(out)];
}

  bindAll('[data-renb]', async b => {

    busy(true);

    busy(false);

  bindAll('[data-delb]', async b => {
    const bid = b.dataset.delb;

/* ============ BẢNG NHẬP ============ */
function closeSheet(){ const el = $('#sheet'); el.classList.remove('on'); el.innerHTML = '' }
function sheet(title, html, onSave){
  const el = $('#sheet');
  el.innerHTML = `<div class="box">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <h2 style="flex:1;font-size:17px">${esc(title)}</h2>
      <button class="pill" id="shX">${t('cancel')}</button></div>
    ${html}
    <button class="btn" id="shOK" style="margin-top:4px">${t('save')}</button></div>`;
  el.classList.add('on');
  el.onclick = e => { if(e.target === el) closeSheet() };
  $('#shX').onclick = closeSheet;
  $('#shOK').onclick = onSave;
}
const UNITS = ['cái','chai','bịch','cuộn','hộp','gói','túi','thùng','bộ','kg'];
const unitPills = id => `<div class="pillrow" style="margin:-4px 0 12px">${UNITS.map(u =>
  `<button class="pill" data-unit="${u}|${id}" style="font-size:12px;padding:5px 10px">${u}</button>`).join('')}</div>`;
function bindUnitPills(){
  bindAll('[data-unit]', b => { const p = b.dataset.unit.split('|'); const el = $('#'+p[1]); if(el) el.value = p[0] });
}

/* ============ KHO ĐỒ DÙNG ============ */
const locName  = l => (lang==='ja' && l.name_ja) || l.name;
const itName   = i => (lang==='ja' && i.name_ja) || i.name;
const unitName = i => (lang==='ja' && i.unit_ja) || i.unit;
const lvOf     = (locId, itemId) => stLv.get(locId + '|' + itemId);
function locStats(l){
  let n = 0, low = 0;
  stItems.forEach(i => {
    const v = lvOf(l.id, i.id);
    if(!v) return;
    n++;
    if(i.min_qty > 0 && v.qty <= i.min_qty) low++;
  });
  return {n, low};
}
function vStock(){
  head(t('stock'));
  if(!stLocs.length){
    $('#view').innerHTML = `<div class="card"><div class="empty"><b>${t('noStock')}</b>${t('errTable')}</div></div>`;
    return;
  }
  const sect = (kind, title) => {
    const ls = stLocs.filter(l => l.kind === kind);
    if(!ls.length) return '';
    return `<div class="card"><div class="eyebrow">${title}</div>${ls.map(l => {
      const st = locStats(l);
      return `<button class="row ${st.low?'st-clean':'st-ok'}" data-loc="${l.id}">
        <span class="dot"></span><span class="main">
        <span class="t1">${esc(locName(l))}</span>
        <span class="t2">${t('itemsHere', st.n)}${st.low?` · ${t('lowN', st.low)}`:''}</span></span>
        <span class="chev">›</span></button>`;
    }).join('')}</div>`;
  };
  $('#view').innerHTML = sect('warehouse', t('warehouses')) + sect('cabinet', t('cabinets'))
    + (me.admin ? `<button class="btn ghost" id="mi">${t('manageItems')}</button>` : '');
  bindAll('[data-loc]', b => go('stockLoc', {id:b.dataset.loc}));
  if(me.admin) $('#mi').onclick = () => go('stockItems');
}
function vStockLoc(){
  const l = stLocs.find(x => x.id === nav.id);
  if(!l) return go('stock');
  head(locName(l), t('back'), () => go('stock'));
  const here = stItems.filter(i => lvOf(l.id, i.id));
  $('#view').innerHTML = (here.length ? `<div class="card" style="padding:0 14px">${here.map(i => {
      const v = lvOf(l.id, i.id), out = v.qty <= 0;
      const emin = v.min_qty != null ? v.min_qty : i.min_qty;
      const low = !out && emin > 0 && v.qty <= emin;
      return `<div class="row ${out?'st-replace':(low?'st-clean':'st-ok')}">
        <span class="dot"></span>
        <button class="main" data-edit="${i.id}" style="text-align:left"><span class="t1">${esc(itName(i))}</span>
          <span class="t2">${esc(unitName(i))}${emin>0?` · ${v.min_qty!=null?t('ownMin', emin):t('globalMin', emin)}`:''}${v.updated_by_name?` · ${esc(v.updated_by_name)} ${dstr(v.updated_at)}`:''}</span></button>
        <span style="display:flex;align-items:center;gap:6px;flex:none">
          ${out?`<span class="tag">${t('outStock')}</span>`:(low?`<span class="tag">${t('lowStock')}</span>`:'')}
          <button class="pill" data-d="${i.id}|-1" style="width:34px;text-align:center">−</button>
          <button class="pill" data-set="${i.id}" style="min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px">${v.qty}</button>
          <button class="pill" data-d="${i.id}|1" style="width:34px;text-align:center">＋</button>
        </span></div>`;
    }).join('')}</div>`
    : `<div class="card"><div class="empty"><b>${t('noStock')}</b>${t('noStockHint')}</div></div>`)
    + `<button class="btn ghost" id="add">${t('addStockItem')}</button>`;

  const save = async (item, qty, delta, minL) => {
    qty = Math.max(0, qty);
    const prev = lvOf(l.id, item.id) || {};
    busy(true);
    const now = new Date().toISOString();
    const row = {location_id:l.id, item_id:item.id, qty, updated_at:now, updated_by_name:me.name};
    if(minL !== undefined) row.min_qty = minL;
    const r1 = await sb.from('stock_levels').upsert(row);
    if(!r1.error) await sb.from('stock_moves').insert({
      location_id:l.id, item_id:item.id, delta, qty_after:qty, created_by_name:me.name});
    busy(false);
    if(r1.error) return toast(t('err') + r1.error.message);
    stLv.set(l.id + '|' + item.id, {location_id:l.id, item_id:item.id, qty,
      min_qty: minL !== undefined ? minL : (prev.min_qty != null ? prev.min_qty : null),
      updated_at:now, updated_by_name:me.name});
    closeSheet(); render();
  };
  bindAll('[data-d]', b => {
    const [id, d] = b.dataset.d.split('|');
    const item = stItems.find(x => x.id === id), v = lvOf(l.id, id);
    save(item, v.qty + (+d), +d);
  });
  const openEdit = (item) => {
    const v = lvOf(l.id, item.id);
    sheet(itName(item), `
      <label class="f"><span>${t('fQty')} (${esc(unitName(item))})</span>
        <input type="number" id="e_qty" inputmode="numeric" value="${v.qty}"></label>
      <label class="f"><span>${t('fMin')}</span>
        <input type="number" id="e_min" inputmode="numeric" placeholder="${item.min_qty}" value="${v.min_qty != null ? v.min_qty : ''}"></label>
      <p class="muted" style="margin:-6px 0 12px;font-size:12.5px">${t('minHintLoc', item.min_qty)}</p>
      <button class="btn danger" id="e_rm" style="margin-bottom:10px">${t('removeHere')}</button>`,
    () => {
      const qi = parseInt($('#e_qty').value);
      const q  = isNaN(qi) ? v.qty : Math.max(0, qi);
      const mv = $('#e_min').value.trim();
      save(item, q, q - v.qty, mv === '' ? null : Math.max(0, parseInt(mv) || 0));
    });
    $('#e_rm').onclick = async () => {
      if(!confirm(t('removeAsk', itName(item)))) return;
      busy(true);
      const {error} = await sb.from('stock_levels').delete()
        .eq('location_id', l.id).eq('item_id', item.id);
      busy(false);
      if(error) return toast(t('err') + error.message);
      stLv.delete(l.id + '|' + item.id);
      closeSheet(); toast(t('removed')); render();
    };
  };
  bindAll('[data-edit]', b => openEdit(stItems.find(x => x.id === b.dataset.edit)));
  bindAll('[data-set]',  b => openEdit(stItems.find(x => x.id === b.dataset.set)));

  $('#add').onclick = () => {
    const avail = stItems.filter(i => !lvOf(l.id, i.id));
    sheet(t('addItemTitle', locName(l)), `
      <label class="f"><span>${t('fName')}</span>
        <input type="text" id="a_name" autocapitalize="sentences"></label>
      ${avail.length ? `<p class="muted" style="margin:-6px 0 6px;font-size:12.5px">${t('fromCatalog')}</p>
      <div class="pillrow" style="margin-bottom:12px">${avail.map(i =>
        `<button class="pill" data-pick="${i.id}" style="font-size:12px;padding:5px 10px">${esc(itName(i))}</button>`).join('')}</div>` : ''}
      <label class="f"><span>${t('fUnit')}</span>
        <input type="text" id="a_unit" value="cái"></label>
      ${unitPills('a_unit')}
      <label class="f"><span>${t('fQty')}</span>
        <input type="number" id="a_qty" inputmode="numeric" value="0"></label>
      <label class="f"><span>${t('fMin')}</span>
        <input type="number" id="a_min" inputmode="numeric" value="0"></label>
      <p class="muted" style="margin:-6px 0 12px;font-size:12.5px">${t('minHintG')}</p>`,
    async () => {
      const name = $('#a_name').value.trim();
      if(!name) return toast(t('nameNeeded'));
      const unit = $('#a_unit').value.trim() || 'cái';
      const qty  = Math.max(0, parseInt($('#a_qty').value) || 0);
      const minQ = Math.max(0, parseInt($('#a_min').value) || 0);
      let item = stItems.find(i => i.name.toLowerCase() === name.toLowerCase()
                               || (i.name_ja || '').toLowerCase() === name.toLowerCase());
      if(!item){
        if(!me.admin) return toast(t('adminOnlyNew'));
        busy(true);
        const ins = await sb.from('stock_items').insert({
          name, unit, min_qty:minQ,
          sort:(stItems[stItems.length-1]?.sort ?? 0) + 1}).select().single();
        busy(false);
        if(ins.error) return toast(t('err') + ins.error.message);
        item = ins.data; stItems.push(item);
        save(item, qty, qty);
      } else {
        save(item, qty, qty, minQ !== item.min_qty ? minQ : null);
      }
    });
    bindUnitPills();
    bindAll('[data-pick]', b => {
      const i = stItems.find(x => x.id === b.dataset.pick);
      $('#a_name').value = itName(i); $('#a_unit').value = unitName(i);
      $('#a_min').value = i.min_qty || 0;
    });
  };
}

  <p class="muted" style="margin:0 0 12px">${t('manageItemsHint')}</p>

      if(error) return toast(t('err') + error.message);
      await loadAll(); closeSheet(); toast(t('itemSaved')); render();
    });
    bindUnitPills();
    if(cur) $('#i_del').onclick = async () => {
      if(!confirm(t('delItemAsk', itName(cur)))) return;
      busy(true);
      const {error} = await sb.from('stock_items').delete().eq('id', cur.id);
      busy(false);
      if(error) return toast(t('err') + error.message);
      await loadAll(); closeSheet(); render();
    };
  };
  bindAll('[data-ei]', b => ask(stItems.find(x => x.id === b.dataset.ei)));
  $('#ni').onclick = () => ask(null);
}

/* ============ KHỞI ĐỘNG ============ */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ go('login'); return }
  const u = session.user;
  const {data:p} = await sb.from('profiles').select('name, role').eq('id', u.id).single();
  me = {id:u.id, email:u.email, name:(p?.name || u.email.split('@')[0]), admin:(p?.role === 'admin')};
  const ok = await loadAll();
  go(ok ? 'home' : 'setup');
}
boot();
